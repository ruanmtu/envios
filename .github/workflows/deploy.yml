name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Enviar arquivos para public_html por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="${FTP_SERVER#ftp://}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$HOST" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror --reverse --verbose --parallel=2 \
              --exclude ^\.git/ --exclude ^\.github/ \
              --exclude-glob .gitignore --exclude-glob LEIA-ME.md --exclude-glob README.md \
              ./ ./;
            bye"
