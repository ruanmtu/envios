name: Mover instalacao de /painel para a raiz

on:
  workflow_dispatch:

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Copiar config da instalacao e remover pastas antigas
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="${FTP_SERVER#ftp://}"
          mkdir -p "$RUNNER_TEMP/cfg"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$HOST" -e "
            set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3;
            set cmd:fail-exit yes;
            get painel/includes/config.php -o $RUNNER_TEMP/cfg/config.php;
            get painel/includes/install.lock -o $RUNNER_TEMP/cfg/install.lock;
            put $RUNNER_TEMP/cfg/config.php -o includes/config.php;
            put $RUNNER_TEMP/cfg/install.lock -o includes/install.lock;
            cls -l includes/config.php includes/install.lock;
            rm -r painel;
            set cmd:fail-exit no;
            rm -r public_html;
            echo 'Pastas antigas removidas';
            cls -1;
            bye"
          rm -rf "$RUNNER_TEMP/cfg"
